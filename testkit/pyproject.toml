[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "lynewright-testkit"
version = "0.1.0"
description = "Pytest fixtures for Lynewright integration authors"
requires-python = ">=3.12"
dependencies = ["pytest>=8.4,<10"]

[project.entry-points.pytest11]
lynewright_testkit = "lynewright_testkit.plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["lynewright_testkit*"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
