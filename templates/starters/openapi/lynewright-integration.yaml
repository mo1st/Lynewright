format: lynewright-integration/1
id: lynewright.integration.template-openapi
name: OpenAPI Example
version: 1.0.0
lynewright_version: ^0.1.0
runtime_kind: openapi
endpoint_url: http://127.0.0.1:8000
credentials: []
openapi:
  inline:
    openapi: 3.0.3
    info:
      title: Lynewright OpenAPI integration example
      version: 1.0.0
    paths:
      /health:
        get:
          operationId: health
          responses:
            '200':
              description: Service health
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status: {type: string}
                    required: [status]
                    additionalProperties: false
      /jobs:
        post:
          operationId: startJob
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    value: {type: string, minLength: 1}
                  required: [value]
                  additionalProperties: false
          responses:
            '200':
              description: Job accepted
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      job_id: {type: string}
                      status: {type: string}
                    required: [job_id, status]
                    additionalProperties: false
      /jobs/{job_id}:
        get:
          operationId: jobStatus
          parameters:
            - name: job_id
              in: path
              required: true
              schema: {type: string}
          responses:
            '200':
              description: Job status
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      job_id: {type: string}
                      status: {type: string}
                    required: [job_id, status]
                    additionalProperties: false
operations:
  - operation_id: health
    enabled: true
    description: Check that the example service is running.
  - operation_id: startJob
    enabled: true
    description: Start a small asynchronous job.
  - operation_id: jobStatus
    enabled: true
    description: Poll a started job.
async:
  operation_id: startJob
  status_operation_id: jobStatus
  job_id_path: job_id
  status_argument_path: path.job_id
